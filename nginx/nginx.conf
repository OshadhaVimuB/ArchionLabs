events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Prefix routes for Archion Build Backend
        location /build/ {
            proxy_pass http://archion-build-backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Prefix routes for Archion Community Backend
        location /community/ {
            proxy_pass http://archion-community-backend:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Prefix routes for Archion Sim Backend
        location /sim/ {
            proxy_pass http://archion-sim-backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Prefix routes for Archion Viewer Backend
        location /viewer/ {
            proxy_pass http://archion-viewer-backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
