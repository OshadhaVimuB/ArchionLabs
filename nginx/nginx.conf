events {
    worker_connections 1024;
}

http {
    # Allow large 3D model file uploads (100 MB)
    client_max_body_size 100m;

    # Timeouts for long-running AI / simulation requests
    proxy_read_timeout    300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;

    server {
        listen 80;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Root location to show status
        location / {
            return 200 'ArchionLabs API Gateway is Running!';
            add_header Content-Type text/plain;
        }

        # Prefix routes for Archion Build Backend
        location /build/ {
            proxy_pass http://archion-build-backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Prefix routes for Archion Community Backend
        location /community/ {
            proxy_pass http://archion-community-backend:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Prefix routes for Archion Sim Backend
        location /sim/ {
            proxy_pass http://archion-sim-backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support for simulation streaming
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }

        # Prefix routes for Archion Viewer Backend
        location /viewer/ {
            proxy_pass http://archion-viewer-backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
