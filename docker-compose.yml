services:
  archion-build-backend:
    build:
      context: ./archion-build/backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    # Exposing only to internal docker network
    expose:
      - "8000"

  archion-community-backend:
    build:
      context: ./archion-community/backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    expose:
      - "5000"

  archion-sim-backend:
    build:
      context: ./archion-sim/backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    expose:
      - "8000"

  archion-viewer-backend:
    build:
      context: ./archion-viewer/backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - archion-build-backend
      - archion-community-backend
      - archion-sim-backend
      - archion-viewer-backend
    restart: unless-stopped
