services:
  archion-build-backend:
    build:
      context: ./archion-build/backend
    container_name: archion-build-backend
    restart: unless-stopped
    env_file:
      - ./archion-build/backend/.env
    environment:
      - NODE_ENV=production
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  archion-community-backend:
    build:
      context: ./archion-community/backend
    container_name: archion-community-backend
    restart: unless-stopped
    env_file:
      - ./archion-community/backend/.env
    environment:
      - NODE_ENV=production
    expose:
      - "5000"
    volumes:
      - community-models:/app/../public/models
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/templates', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  archion-sim-backend:
    build:
      context: ./archion-sim/backend
    container_name: archion-sim-backend
    restart: unless-stopped
    env_file:
      - ./archion-sim/backend/.env
    environment:
      - NODE_ENV=production
    expose:
      - "8000"
    volumes:
      - sim-uploads:/app/uploads
      - sim-reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  archion-viewer-backend:
    build:
      context: ./archion-viewer/backend
    container_name: archion-viewer-backend
    restart: unless-stopped
    env_file:
      - ./archion-viewer/backend/.env
    environment:
      - NODE_ENV=production
    expose:
      - "8000"
    volumes:
      - viewer-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: archion-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      archion-build-backend:
        condition: service_started
      archion-community-backend:
        condition: service_started
      archion-sim-backend:
        condition: service_started
      archion-viewer-backend:
        condition: service_started
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: archion-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

volumes:
  community-models:
  sim-uploads:
  sim-reports:
  viewer-uploads:
  certbot-etc:
  certbot-var:
  certbot-webroot:
