name: Deploy Backends to DigitalOcean

on:
  push:
    branches:
      - main
    paths:
      - '**/backend/**'
      - 'docker-compose.yml'
      - 'nginx/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: ${{ secrets.DO_SSH_USERNAME }}
          password: ${{ secrets.DO_PASSWORD }}
          script: |
            # Navigate to the project directory on the Droplet
            cd /opt/ArchionLabs
            
            # Pull latest changes from git
            git fetch
            git reset --hard origin/main
            
            # Rebuild and restart the containers silently
            docker compose up -d --build
            
            # Clean up old dangling images to save space
            docker image prune -f
