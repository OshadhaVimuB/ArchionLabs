name: Deploy Backends to DigitalOcean

on:
  push:
    branches:
      - main
    paths:
      - '**/backend/**'
      - 'docker-compose.yml'
      - 'nginx/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: ${{ secrets.DO_SSH_USERNAME }}
          password: ${{ secrets.DO_PASSWORD }}
          script: |
            # Navigate to the project directory
            cd /opt/ArchionLabs || { echo "Directory /opt/ArchionLabs not found"; exit 1; }
            
            # Debug: show current files
            ls -la
            
            # Pull latest changes (This will fail until Step 1 of my previous advice is done)
            git fetch origin
            git reset --hard origin/main
            
            # Rebuild and restart the containers
            # Using -f to be explicit about the file
            docker compose -f docker-compose.yml up -d --build
            
            # Clean up
            docker image prune -f
